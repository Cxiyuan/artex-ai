services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-apagent}
      # 容器时区：date / 日志 / psql 输出都用中国时间。tzdata 已在镜像内。
      TZ: Asia/Shanghai
    # PostgreSQL 的 timezone 是 GUC，不会跟着 TZ 走（而且这个数据卷是在 UTC 下
    # initdb 的），所以在启动参数上显式覆盖：now()、日志时间戳才是 +08。
    command: ["postgres", "-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apagent} -d ${POSTGRES_DB:-apagent}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  apagent:
    # 直接拉 CI 产出的多架构镜像（.github/workflows/build-docker.yml → ghcr.io）。
    # 固定版本：在 .env 里设 APAGENT_IMAGE=ghcr.io/cxiyuan/artex-ai:v2.2.0
    # （私有包需先 docker login ghcr.io；自建镜像则设 APAGENT_IMAGE=artex-ai:latest）
    image: ${APAGENT_IMAGE:-ghcr.io/cxiyuan/artex-ai:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APAGENT_PG_DSN: postgres://${POSTGRES_USER:-apagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apagent}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APAGENT_LLM_PROVIDER: ${APAGENT_LLM_PROVIDER:-}
      APAGENT_LLM_MODEL: ${APAGENT_LLM_MODEL:-}
      APAGENT_LLM_BASE_URL: ${APAGENT_LLM_BASE_URL:-}
      APAGENT_LLM_PROXY: ${APAGENT_LLM_PROXY:-}
      # JWT 签名密钥目录。必须落在持久化卷里，否则每次重建容器都会重新生成密钥，
      # 把所有已登录会话踢下线（数据与管理员密码不受影响，但要重新登录）。
      APAGENT_KEY_DIR: /app/keys
      # 容器时区。Go 的 time.Local（日志时间戳、prompt 里的 {{.Now}}、任务超时
      # 判定用的 wall clock 文案）都取自它；镜像里已带 tzdata 与 /etc/localtime。
      TZ: Asia/Shanghai
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 工作目录（traffic 录制等）绑定到项目根目录的 data/，方便在宿主机直接查看/备份。
      # 注意：JWT 签名密钥刻意不放这里（它不应该能被文件管理器浏览/下载），
      # 而是单独落在下面的 ./keys。
      - ./data:/app/data
      # JWT 签名密钥（当前密钥仅 32 字节）；容器重建后会话仍然有效。
      - ./keys:/app/keys
      # skills/ 已经打进镜像（Dockerfile COPY），不再从宿主机挂载。
      # 修改它需要重新构建并推送镜像（CI 会自动构建多架构镜像）。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
