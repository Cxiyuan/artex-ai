name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 需要

# 与 build-macos-intel.yml 共用并发组：两个工作流都会往同一个 Release 挂
# SHA256SUMS，串行执行才能保证清单不互相覆盖。
concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 四平台交叉编译（内嵌前端）+ 打 zip
  #    macOS Intel（darwin/amd64）由 build-macos-intel.yml 在原生 Intel 机器上构建，
  #    这里不再重复产出同名资产（否则两个工作流会抢同一个 zip 名）。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          APAGENT_TARGET_OS: ${{ matrix.goos }}
          APAGENT_TARGET_ARCH: ${{ matrix.goarch }}
          APAGENT_BUILD_VERSION: ${{ github.ref_name }}
          APAGENT_SKIP_FRONTEND: "1"
          APAGENT_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          APAGENT_COMPRESS: "0"
          APAGENT_PACKAGE: "1"
          APAGENT_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${APAGENT_TARGET_OS}/${APAGENT_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/apagent-linux-amd64/apagent -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/apagent-linux-${{ matrix.goarch }}/apagent

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum *.zip > SHA256SUMS.new
          # 保留同一 Release 上 build-macos-intel.yml 产出的 darwin/amd64 校验和，
          # 否则会把它冲掉，导致 macOS Intel 的一键更新拒装。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D "$RUNNER_TEMP/old" || true
          fi
          if [ -s "$RUNNER_TEMP/old/SHA256SUMS" ]; then
            cat SHA256SUMS.new "$RUNNER_TEMP/old/SHA256SUMS" \
              | awk 'NF>=2 && !seen[$2]++' \
              | sort -k2 > SHA256SUMS
            rm -f SHA256SUMS.new
          else
            mv SHA256SUMS.new SHA256SUMS
          fi
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # ④ 多架构镜像 → 推 Docker Hub（复用 binaries 编好的 Linux 二进制，
  #    镜像里只装工具 + 放二进制；arm64 仅需模拟 apt 层，构建快很多）
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: artex-ai
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
