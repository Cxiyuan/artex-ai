name: build-macos-intel

# 只为 macOS Intel（darwin/amd64）构建「开箱即用」的完整发布包：
#   - 前端静态产物经 -tags embedui 内嵌进单二进制，运行期不需要 Node / npm
#   - zip 内含 apagent + start.sh（守护/一键更新入口）+ skills/ + config.example.json
#   - 产物名与 selfupdate 的约定严格一致：apagent-<版本>-darwin-amd64.zip + SHA256SUMS
#     （selfupdate.AssetName 去掉 v 前缀），所以发布后 macOS Intel 上的
#     「系统配置 → 版本与更新」一键更新可以直接用。
#
# 触发方式：
#   1) 打 tag 推送（v*）→ 构建并发布 Release
#   2) Actions 页手动 Run workflow → 默认只产出 artifact 供下载；
#      填了 tag 就同时创建/更新该 tag 的 Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v2.2.0）。留空 = 只构建并上传 artifact，不创建 Release"
        required: false
        default: ""
      runner:
        description: "Runner 标签（必须是 x86_64 的 macOS 镜像）"
        required: false
        default: "macos-15-intel"

permissions:
  contents: write # 创建/更新 Release 需要

# 与 release.yml 共用同一个并发组：两者都会往同一个 Release 挂 SHA256SUMS，
# 串行执行才能保证清单不互相覆盖。注意 macOS runner 计费倍率高，默认不取消进行中的任务。
concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macos-13（原 Intel 镜像）已于 2025-12-04 退役，官方给出的 x86_64 继任标签是
    # macos-15-intel（可用至 ~2027-08）；macos-26-intel 亦可。
    # 用原生 Intel 机跑，才能在真机上对产物做冒烟测试。
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # 不在工作区留下凭据；发布用 GH_TOKEN 环境变量

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }} # 经环境变量传入，不直接拼进 shell（防注入）
        run: |
          set -euo pipefail
          raw="$INPUT_TAG"
          publish=false
          # tag 推送：用 ref 名；手动触发填了 tag：用它
          if [ -z "$raw" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            raw="${GITHUB_REF_NAME}"
          fi
          if [ -n "$raw" ] && { [ "${GITHUB_REF_TYPE}" = "tag" ] || [ -n "$INPUT_TAG" ]; }; then
            publish=true
          fi
          if [ -z "$raw" ]; then
            # 纯构建：用前端 package.json 的版本，仅用于文件名，不发布
            raw="v$(node -p "require('./web/package.json').version")"
          fi
          raw="${raw#v}"
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          echo "tag=v${raw}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "版本：v${raw}，发布：${publish}"

      - uses: actions/setup-go@v5
        with:
          # go.mod 要求 go >= 1.26.3，取 1.26 的最新补丁版
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # build.sh 负责全链路：npm ci → next build:static → 拷进 server/webui/dist
      # → CGO 关闭交叉编译 -tags embedui → 打包 zip（含 start.sh / skills / 配置示例）
      # → 生成 SHA256SUMS。复用脚本而不是在 YAML 里重抄一遍，是为了让本地构建与
      # CI 产物完全同构（页面一键更新不认两套命名）。
      - name: Build and package darwin/amd64
        env:
          APAGENT_BUILD_VERSION: ${{ steps.ver.outputs.tag }}
          APAGENT_COMPRESS: "0" # 不用 UPX：macOS 上易被 Gatekeeper/签名校验干扰
          APAGENT_PACKAGE: "1"
          APAGENT_OUTPUT_DIR: dist
          APAGENT_PACKAGE_DIR: dist
        run: ./build.sh --target darwin/amd64

      - name: Smoke test on native Intel runner
        run: |
          set -euo pipefail
          bin=dist/apagent-darwin-amd64/apagent
          desc="$(file -b "$bin")"
          echo "file: $desc"
          case "$desc" in
            *"Mach-O 64-bit executable x86_64"*) ;;
            *) echo "::error::不是 macOS Intel (x86_64) Mach-O：$desc"; exit 1 ;;
          esac
          # 前端必须真的内嵌进来了（否则跑起来只有 API、没有 UI）
          strings -a "$bin" > "$RUNNER_TEMP/strings.txt"
          if grep -q "/_next/" "$RUNNER_TEMP/strings.txt"; then
            echo "OK: 前端静态资源已内嵌"
          else
            echo "::warning::二进制里没找到 /_next/ 痕迹，请确认 -tags embedui 生效"
          fi
          # 服务器启动依赖 PostgreSQL，这里只验证二进制真的能执行、参数解析正常。
          # Go 的 flag 包在 -h 时以 2 退出，属正常行为。
          set +e
          out=$("$bin" -h 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::二进制无法执行（exit=$code）"
            exit 1
          fi
          grep -qi "usage of" <<<"$out"

      - name: Verify package layout
        id: pkg
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/apagent-${VER}-darwin-amd64.zip"
          test -f "$zip"
          unzip -l "$zip"
          # 解压后按用户真实用法定向检查：二进制可执行、守护脚本可执行、skills 与配置示例齐全
          root="$(unzip -Z1 "$zip" | awk 'NR==1 { split($0, a, "/"); print a[1] }')"
          mkdir -p "$RUNNER_TEMP/pkg"
          unzip -q "$zip" -d "$RUNNER_TEMP/pkg"
          pkg="$RUNNER_TEMP/pkg/$root"
          test -x "$pkg/apagent"
          test -x "$pkg/start.sh"
          test -d "$pkg/skills"
          test -f "$pkg/config.example.json"
          # SHA256SUMS 必须收录本包，否则 selfupdate 会拒绝安装
          grep -q "$(basename "$zip")" dist/SHA256SUMS
          shasum -a 256 -c dist/SHA256SUMS
          echo "zip_name=$(basename "$zip")" >> "$GITHUB_OUTPUT"
          echo "OK: $root 结构完整"

      - uses: actions/upload-artifact@v4
        with:
          name: apagent-darwin-amd64-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      # 同一个 Release 上可能还挂着 release.yml 产出的其它平台包（各自生成 SHA256SUMS）。
      # 先取回已有清单再合并，否则谁后跑谁把对方平台的校验和冲掉，
      # 其它平台的一键更新会因「SHA256SUMS 未收录」而失败。
      - name: Merge SHA256SUMS with existing release assets
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p SHA256SUMS -D "$RUNNER_TEMP/old" || true
          fi
          if [ -s "$RUNNER_TEMP/old/SHA256SUMS" ]; then
            # 新清单优先（同名文件以本次构建为准），再按文件名去重
            cat dist/SHA256SUMS "$RUNNER_TEMP/old/SHA256SUMS" \
              | awk 'NF>=2 && !seen[$2]++' \
              | sort -k2 > dist/SHA256SUMS.merged
            mv dist/SHA256SUMS.merged dist/SHA256SUMS
          fi
          echo "===== SHA256SUMS ====="
          cat dist/SHA256SUMS

      - name: Publish Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          append_body: true
          body: |

            ## macOS Intel (x86_64) 单文件发布包

            - 资产：`${{ steps.ver.outputs.zip_name }}`（前端已内嵌，无需 Node/Go 环境）
            - 内容：`apagent` + `start.sh` + `skills/` + `config.example.json` + `README.md`
            - 运行（需要 PostgreSQL 服务）：
              ```bash
              unzip ${{ steps.ver.outputs.zip_name }}
              cd apagent-${{ steps.ver.outputs.version }}-darwin-amd64
              cp config.example.json config.json   # 填 database 连接
              ./start.sh                           # → http://localhost:8787
              ```
            - 必须用 `./start.sh` 启动（守护 + 一键更新入口），不要直接跑 `./apagent`。
            - 未做 Apple 签名/公证，首次运行若被 Gatekeeper 拦截：
              `xattr -dr com.apple.quarantine apagent start.sh`
            - `SHA256SUMS` 覆盖本 Release 全部平台资产；macOS Intel 上「页面一键更新」可直接使用。
